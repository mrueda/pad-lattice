[package]
name = "pad-lattice-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = ["custom-protocol", "dep:webkit2gtk", "dep:cairo-rs"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }
