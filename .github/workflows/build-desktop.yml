name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref: main for a preview, or an existing annotated vX.Y.Z tag'
        required: true
        default: main
        type: string
      platform:
        description: Platform
        default: all
        type: choice
        options: [all, linux-x64, linux-arm64, macos-x64, macos-arm64]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: source
        env:
          SOURCE_REF: ${{ inputs.ref }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from check_desktop_versions import check_versions
          version = check_versions()
          ref = os.environ['SOURCE_REF']
          if ref != 'main':
              if not re.fullmatch(r'v\d+\.\d+\.\d+', ref) or ref != f'v{version}':
                  raise SystemExit('Choose main or an annotated tag matching the Python version')
              kind = subprocess.check_output(['git', 'cat-file', '-t', f'refs/tags/{ref}'], text=True).strip()
              if kind != 'tag':
                  raise SystemExit('An annotated tag is required')
          platforms = [
              {'platform': 'linux-x64', 'os': 'ubuntu-24.04', 'bundle': 'appimage,deb'},
              {'platform': 'linux-arm64', 'os': 'ubuntu-24.04-arm', 'bundle': 'appimage,deb'},
              {'platform': 'macos-x64', 'os': 'macos-15-intel', 'bundle': 'dmg'},
              {'platform': 'macos-arm64', 'os': 'macos-15', 'bundle': 'dmg'},
          ]
          chosen = [p for p in platforms if os.environ['PLATFORM'] in ('all', p['platform'])]
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nversion={version}\nmatrix={json.dumps({"include": chosen})}\n')
          PY
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb xauth
      - name: Install build dependencies
        run: |
          python -m pip install '.[desktop-build,schema]'
          npm --prefix web-app ci
      - name: Verify source and frontend
        run: |
          python scripts/check_desktop_versions.py
          python -m unittest discover -s tests
          npm --prefix web-app test
          npm --prefix web-app run build
      - name: Bundle engine and test relocation
        env:
          PAD_LATTICE_TEST_ENGINE: ${{ github.workspace }}/web-app/src-tauri/engine/pad-lattice-engine
        run: |
          python scripts/build_desktop_engine.py
          python -m unittest discover -s tests -p test_desktop.py
          cargo test --manifest-path web-app/src-tauri/Cargo.toml --locked
      - name: Verify native window
        timeout-minutes: 5
        env:
          PAD_LATTICE_SMOKE_DIR: /tmp/pl-desktop-smoke
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        shell: bash
        run: |
          if [ '${{ runner.os }}' = Linux ]; then
            xvfb-run -a cargo run --manifest-path web-app/src-tauri/Cargo.toml --features native-smoke --locked
          else
            cargo run --manifest-path web-app/src-tauri/Cargo.toml --features native-smoke --locked
          fi
          python -c "import json; assert json.load(open('/tmp/pl-desktop-smoke/result.json'))['success']"
      - name: Build installers
        working-directory: web-app
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Collect installers and checksums
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          target = Path('build/installers'); target.mkdir(parents=True, exist_ok=True)
          files = [p for p in Path('web-app/src-tauri/target/release/bundle').rglob('*') if p.suffix in ('.dmg', '.deb', '.AppImage')]
          if not files: raise SystemExit('No installers found')
          for path in files:
              name = f'pad-lattice-{os.environ["VERSION"]}-{os.environ["PLATFORM"]}{path.suffix}'
              shutil.copy2(path, target / name)
              (target / (name + '.sha256')).write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name + '\n')
          (target / 'source.json').write_text(json.dumps({'sha': os.environ['SOURCE_SHA'], 'version': os.environ['VERSION'], 'platform': os.environ['PLATFORM']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pad-lattice-${{ matrix.platform }}-${{ needs.prepare.outputs.sha }}
          path: build/installers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-${{ matrix.platform }}
          path: |
            /tmp/pl-desktop-smoke/*.png
            /tmp/pl-desktop-smoke/*.json
          if-no-files-found: ignore
